name: WebVoc Quality Gate

# Runs the ontology quality gate whenever a Pull Request touches the staging
# version of the vocabulary. Blocks the merge if any ERROR-level finding is
# reported by scripts/validate_ontology.py.

on:
  pull_request:
    paths:
      - "stagingVersion/**.jsonld"
  workflow_dispatch: {}   # allows manually re-running the gate from the Actions tab

# NEW: explicit permissions so the "Publish report as PR comment" step
# is actually allowed to write a comment on the Pull Request.
# Without this, many orgs default GITHUB_TOKEN to read-only, and the
# createComment() call below fails with a 403 "Resource not accessible"
# error.
permissions:
  contents: read
  pull-requests: write

jobs:
  quality-gate:
    name: Validate stagingVersion/gs1DEWebVoc.jsonld
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed so we can diff against currentVersion

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run quality gate
        run: |
          python scripts/validate_ontology.py \
            "stagingVersion/gs1DEWebVoc.jsonld" \
            --baseline "currentVersion/gs1DEWebVoc.jsonld"

      # Optional: publish the report as a PR comment for easier review
      - name: Publish report as PR comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "❌ **WebVoc Quality Gate failed.** See the *Run quality gate* step " +
                    "in the Actions log for the full report (blocking errors + warnings)."
            })
